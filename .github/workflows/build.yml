name: Build Native iOS 26 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 确认 Xcode 26 (iOS 26 SDK) 环境
        run: |
          if ls -d /Applications/Xcode_26*.app >/dev/null 2>&1; then
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
            echo "✅ 切换到官方 Xcode 26: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: 3. 规整最新工程目录并修复第474行推导超时
        run: |
          find . -maxdepth 2 -iname "*.zip" -exec unzip -o -q "{}" \;

          TARGET_DIR=""
          while IFS= read -r pkg_file; do
            DIR=$(dirname "$pkg_file")
            if [ -z "$TARGET_DIR" ] || [ "$pkg_file" -nt "$TARGET_DIR/Package.swift" ]; then
              TARGET_DIR="$DIR"
            fi
          done < <(find . -name "Package.swift" -not -path "*/.*")

          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 未找到 Package.swift 目录"
            exit 1
          fi
          echo "✅ 锁定工程目录: $TARGET_DIR"
          
          rm -rf AppSource
          mv "$TARGET_DIR" AppSource

          # 单行修复 WidgetFanFolder.swift 第 474 行泛型推导超时，不加任何假 UI
          find AppSource -name "WidgetFanFolder.swift" -exec sed -i '' 's/\.fill(\.ultraThinMaterial\.opacity(0\.55))/\.fill(\.ultraThinMaterial)\.opacity(0.55)/g' {} +

      - name: 4. 使用原生 iOS 26 SDK 编译并打包 IPA
        run: |
          cd AppSource
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="幼刀"; fi
          echo "🚀 正在使用 Xcode 26 原生编译 Scheme: $SCHEME"

          set +e
          xcodebuild build \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" > build.log 2>&1
          
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "==================== [ 编译错误详情 ] ===================="
            grep -E "error:" build.log | head -n 30
            echo "=========================================================="
            exit $BUILD_STATUS
          fi
          set -e

          PRODUCTS_DIR=$(find ./build -type d -path "*/Build/Products/Release-iphoneos" | head -n 1)
          echo "✅ 产物目录: $PRODUCTS_DIR"

          mkdir -p Payload/YouDao.app

          # 1. 拷贝二进制主程序
          APP_BIN=$(find "$PRODUCTS_DIR" -maxdepth 1 -type f -perm +111 ! -name "*.*" ! -name ".*" | head -n 1)
          if [ -z "$APP_BIN" ]; then
            APP_BIN=$(find "$PRODUCTS_DIR" -name "幼刀" -o -name "AppModule" | head -n 1)
          fi
          echo "✅ 锁定可执行文件: $APP_BIN"
          cp "$APP_BIN" Payload/YouDao.app/YouDao
          chmod +x Payload/YouDao.app/YouDao

          # 2. 拷贝资源 Bundle
          find "$PRODUCTS_DIR" -maxdepth 1 -type d -name "*.bundle" | while read -r bndl; do
            cp -R "$bndl/"* Payload/YouDao.app/ 2>/dev/null || true
          done

          # 3. 编译应用图标与资源库
          ASSETS_DIR=$(find . -maxdepth 2 -name "Assets.xcassets" | head -n 1)
          if [ -n "$ASSETS_DIR" ]; then
            echo "🎨 正在编译素材库: $ASSETS_DIR"
            xcrun actool "$ASSETS_DIR" \
              --compile Payload/YouDao.app \
              --platform iphoneos \
              --minimum-deployment-target 18.0 \
              --app-icon AppIcon \
              --output-partial-info-plist partial_assetcatalog.plist || true
          fi

          # 4. 使用原生 plutil 生成完整 Info.plist (关闭旧版兼容模式，激活 iOS 26 原生液态玻璃)
          PLIST="Payload/YouDao.app/Info.plist"
          plutil -create xml1 "$PLIST"
          plutil -insert CFBundleDevelopmentRegion -string "zh_CN" "$PLIST"
          plutil -insert CFBundleDisplayName -string "幼刀" "$PLIST"
          plutil -insert CFBundleExecutable -string "YouDao" "$PLIST"
          plutil -insert CFBundleIdentifier -string "com.kunoouc.youdao" "$PLIST"
          plutil -insert CFBundleInfoDictionaryVersion -string "6.0" "$PLIST"
          plutil -insert CFBundleName -string "幼刀" "$PLIST"
          plutil -insert CFBundlePackageType -string "APPL" "$PLIST"
          plutil -insert CFBundleShortVersionString -string "1.0" "$PLIST"
          plutil -insert CFBundleVersion -string "1" "$PLIST"
          plutil -insert LSRequiresIPhoneOS -bool true "$PLIST"
          plutil -insert MinimumOSVersion -string "18.0" "$PLIST"
          plutil -insert UIDesignRequiresCompatibility -bool false "$PLIST"
          plutil -insert UIDeviceFamily -json '[1, 2]' "$PLIST"
          plutil -insert UILaunchScreen -json '{}' "$PLIST"
          plutil -insert UIRequiredDeviceCapabilities -json '["arm64"]' "$PLIST"
          plutil -insert UISupportedInterfaceOrientations -json '["UIInterfaceOrientationPortrait","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST"
          plutil -insert "UISupportedInterfaceOrientations~ipad" -json '["UIInterfaceOrientationPortrait","UIInterfaceOrientationPortraitUpsideDown","UIInterfaceOrientationLandscapeLeft","UIInterfaceOrientationLandscapeRight"]' "$PLIST"
          plutil -insert NSPhotoLibraryUsageDescription -string "需要访问您的相册以自定义桌面壁纸、小组件配图与聊天头像" "$PLIST"

          if [ -f "partial_assetcatalog.plist" ]; then
            /usr/libexec/PlistBuddy -x -c "Merge partial_assetcatalog.plist" "$PLIST" || true
          fi

          plutil -convert binary1 "$PLIST"

          # 5. 打包输出 IPA
          zip -qry YouDao.ipa Payload
          mv YouDao.ipa "$GITHUB_WORKSPACE/YouDao.ipa"
          echo "🎉 纯正 Xcode 26 / iOS 26 原生液态玻璃 IPA 打包完成！"

      - name: 5. 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "幼刀 原生 iOS 26 液态玻璃版 IPA (Build ${{ github.run_number }})"
          files: YouDao.ipa
          token: ${{ secrets.GITHUB_TOKEN }}
